/* ─── GOOGLE DRIVE SYNC ──────────────────────────────────────────────────────
   Uses OAuth 2.0 implicit token flow (no server needed).
   Stores all notes in a single file: nexusbase-data.json in Drive root.
   Falls back to IndexedDB when offline or not signed in.
──────────────────────────────────────────────────────────────────────────── */
const DRIVE_FILE_NAME = "nexusbase-data.json";
const DRIVE_SCOPE     = "https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file";

// Token stored in memory only (never localStorage — security)
let _gToken = null;
let _tokenExpiry = 0;

function tokenValid() { return _gToken && Date.now() < _tokenExpiry; }

// Request an access token via Google Identity Services popup
function requestGoogleToken(clientId) {
  return new Promise((resolve, reject) => {
    if (!window.google?.accounts?.oauth2) { reject(new Error("GSI not loaded")); return; }
    const client = window.google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: DRIVE_SCOPE,
      callback: (resp) => {
        if (resp.error) { reject(new Error(resp.error)); return; }
        _gToken = resp.access_token;
        _tokenExpiry = Date.now() + (resp.expires_in - 60) * 1000;
        resolve(_gToken);
      },
    });
    client.requestAccessToken({ prompt: "consent" });
  });
}

async function driveReq(method, url, body, token) {
  const headers = { Authorization: `Bearer ${token}` };
  if (body && !(body instanceof FormData)) headers["Content-Type"] = "application/json";
  const res = await fetch(url, { method, headers, body: body instanceof FormData ? body : body ? JSON.stringify(body) : undefined });
  if (!res.ok) throw new Error(`Drive API ${res.status}: ${await res.text()}`);
  const ct = res.headers.get("content-type") || "";
  return ct.includes("json") ? res.json() : res.text();
}

// Find nexusbase-data.json in appDataFolder, return fileId or null
async function findDriveFile(token) {
  const res = await driveReq("GET",
    "https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27nexusbase-data.json%27&fields=files(id,name)",
    null, token);
  return res.files?.length ? res.files[0].id : null;
}

// Read file content
async function readDriveFile(fileId, token) {
  const text = await driveReq("GET",
    `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
    null, token);
  return typeof text === "string" ? JSON.parse(text) : text;
}

// Create or update file
async function writeDriveFile(fileId, data, token) {
  const content = JSON.stringify(data);
  const blob = new Blob([content], { type: "application/json" });

  if (fileId) {
    // Update existing
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify({})], { type: "application/json" }));
    form.append("file", blob);
    return driveReq("PATCH",
      `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`,
      form, token);
  } else {
    // Create new in appDataFolder (invisible to user's Drive, only accessible by this app)
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify({
      name: DRIVE_FILE_NAME,
      parents: ["appDataFolder"]
    })], { type: "application/json" }));
    form.append("file", blob);
    return driveReq("POST",
      "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
      form, token);
  }
}

/* ─── RFC-4180 CSV PARSER ────────────────────────────────────────────────── */
function parseCSV(text){
  const rows=[];let inQ=false,field="",row=[];
  const push=()=>{row.push(field);field="";};
  const next=()=>{rows.push(row);row=[];};
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(inQ){if(c==='"'&&n==='"'){field+='"';i++;}else if(c==='"'){inQ=false;}else{field+=c;}}
    else{if(c==='"'){inQ=true;}else if(c===','){push();}else if(c==='\r'&&n==='\n'){push();next();i++;}else if(c==='\n'||c==='\r'){push();next();}else{field+=c;}}
  }
  push();if(row.length>1||row[0]!=="")next();
  return rows;
}
function csvToObjects(text){
  const rows=parseCSV(text.trim());
  if(rows.length<2)return{fields:[],data:[]};
  const fields=rows[0];
  const data=rows.slice(1).filter(r=>r.some(c=>c.trim()!=="")).map(r=>Object.fromEntries(fields.map((f,i)=>[f,(r[i]||"").trim()])));
  return{fields,data};
}

function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

/* ─── INDEXEDDB (offline cache) ─────────────────────────────────────────── */
let _db=null;
async function getDB(){
  if(_db)return _db;
  return new Promise((res,rej)=>{
    const req=indexedDB.open("nexusbase_v5",1);
    req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains("store"))e.target.result.createObjectStore("store");};
    req.onsuccess=e=>{_db=e.target.result;res(_db);};
    req.onerror=e=>rej(e.target.error);
  });
}
async function idbGet(key){const db=await getDB();return new Promise((res,rej)=>{const r=db.transaction("store","readonly").objectStore("store").get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(key,val){const db=await getDB();return new Promise((res,rej)=>{const r=db.transaction("store","readwrite").objectStore("store").put(val,key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}

/* ─── REDUCER ───────────────────────────────────────────────────────────── */
function reducer(state,action){
  switch(action.type){
    case"INIT":return{...action.payload,lastModified:new Date().toISOString()};
    case"ADD_NOTE":return{...state,notes:[action.note,...state.notes],lastModified:new Date().toISOString()};
    case"UPDATE_NOTE":return{...state,notes:state.notes.map(n=>n.id===action.id?{...n,...action.updates,updatedAt:new Date().toISOString()}:n),lastModified:new Date().toISOString()};
    case"DELETE_NOTE":return{...state,notes:state.notes.filter(n=>n.id!==action.id),lastModified:new Date().toISOString()};
    case"ADD_FOLDER":return{...state,folders:[...state.folders,action.folder],lastModified:new Date().toISOString()};
    case"IMPORT_NOTES":return{...state,notes:[...action.notes,...state.notes],lastModified:new Date().toISOString()};
    default:return state;
  }
}

/* ─── CANVAS ─────────────────────────────────────────────────────────────── */
const DrawCanvas=memo(function DrawCanvas({layers,isActive,color,size,onStrokeDone}){
  const canvasRef=useRef(null);const ctxRef=useRef(null);
  const drawing=useRef(false);const current=useRef([]);const dirty=useRef(true);
  useEffect(()=>{
    const canvas=canvasRef.current;
    const ro=new ResizeObserver(()=>{
      const dpr=window.devicePixelRatio||1;const{width,height}=canvas.getBoundingClientRect();
      canvas.width=width*dpr;canvas.height=height*dpr;
      const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);ctxRef.current=ctx;dirty.current=true;
    });
    ro.observe(canvas);return()=>ro.disconnect();
  },[]);
  useEffect(()=>{
    let alive=true;
    const loop=()=>{if(!alive)return;if(dirty.current){redraw();dirty.current=false;}requestAnimationFrame(loop);};
    requestAnimationFrame(loop);return()=>{alive=false;};
  });
  useEffect(()=>{dirty.current=true;},[layers]);
  function redraw(){
    const ctx=ctxRef.current;if(!ctx)return;
    const dpr=window.devicePixelRatio||1;const canvas=canvasRef.current;
    ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);
    layers.forEach(l=>{if(l.visible)l.strokes.forEach(s=>stk(ctx,s));});
  }
  function stk(ctx,s){
    if(!s.pts||s.pts.length<2)return;
    ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.lineCap="round";ctx.lineJoin="round";
    ctx.moveTo(s.pts[0].x,s.pts[0].y);s.pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();
  }
  function pt(e){const r=canvasRef.current.getBoundingClientRect();const src=e.touches?e.touches[0]:e;return{x:src.clientX-r.left,y:src.clientY-r.top};}
  function onDown(e){if(!isActive)return;e.preventDefault();drawing.current=true;current.current=[pt(e)];}
  function onMove(e){
    if(!drawing.current||!isActive)return;e.preventDefault();current.current.push(pt(e));
    const ctx=ctxRef.current;if(!ctx)return;
    const dpr=window.devicePixelRatio||1;const canvas=canvasRef.current;
    ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);redraw();stk(ctx,{pts:current.current,color,size});
  }
  function onUp(){if(!drawing.current)return;drawing.current=false;if(current.current.length>1)onStrokeDone({pts:[...current.current],color,size});current.current=[];dirty.current=true;}
  return(
    <div className={`canvas-wrap ${isActive?"active":""}`}>
      <canvas ref={canvasRef} style={{width:"100%",height:"100%",cursor:isActive?"crosshair":"default"}}
        onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
        onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}/>
    </div>
  );
});

            <a href="https://console.cloud.google.com" target="_blank" style={{display:"inline-flex",alignItems:"center",gap:6,marginTop:10,color:T.green,fontSize:12,textDecoration:"none"}}>
              <i className="ti ti-external-link"/>Open Google Cloud Console →
            </a>

        )}

        {/* Status */}
        {isConfigured&&(

            <div style={{display:"flex",alignItems:"center",gap:12}}>

                <i className={`ti ${syncState==="synced"||syncState==="syncing"?"ti-brand-google":"ti-cloud-off"}`} style={{fontSize:20,color:syncState==="synced"?"#ea4335":syncState==="syncing"?T.green:T.muted}}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:13,color:syncState==="synced"||syncState==="syncing"?T.green:T.white}}>
                  {syncState==="synced"&&`Synced via Google Drive`}
                  {syncState==="syncing"&&"Syncing…"}
                  {syncState==="signed-out"&&"Not signed in"}
                  {syncState==="error"&&"Sync error"}
                  {syncState==="offline"&&"Offline — local only"}
                </div>
                <div style={{fontSize:11,color:T.muted,marginTop:2}}>
                  {syncState==="synced"&&`${userEmail} · ${noteCount} notes synced`}
                  {syncState==="signed-out"&&"Sign in to sync across Mac, Windows, and iPhone"}
                  {syncState==="error"&&"Could not reach Google Drive — check connection"}
                  {syncState==="offline"&&"Changes saved locally and will sync when reconnected"}
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Sign in / out */}
        {isConfigured&&syncState==="signed-out"&&(
          <button className="mbtn pri" style={{width:"100%",justifyContent:"center",marginBottom:14,padding:"11px 18px"}} onClick={onSignIn}>
            <i className="ti ti-brand-google" style={{fontSize:16}}/> Sign in with Google
          </button>
        )}
        {isConfigured&&(syncState==="synced"||syncState==="syncing")&&(
          <button className="mbtn" style={{width:"100%",justifyContent:"center",marginBottom:14}} onClick={onSignOut}>
            <i className="ti ti-logout"/> Sign out ({userEmail})
          </button>
        )}

        {/* How sync works */}
        {isConfigured&&<>
          <div style={{borderTop:`1px solid ${T.border}`,margin:"16px 0"}}/>
          <div style={{fontSize:12,color:T.muted,lineHeight:1.8,marginBottom:16}}>
            <strong style={{color:T.white,display:"block",marginBottom:6}}>How it works</strong>
            Notes are stored in a private file (<code style={{color:T.greenLt,fontFamily:"monospace"}}>nexusbase-data.json</code>) in your Google Drive's hidden app folder — only NexusBase can read it, not visible in your normal Drive. Syncs automatically every 30 seconds and on every edit.
          </div>
        </>}

        {/* Export */}
        <div style={{borderTop:`1px solid ${T.border}`,margin:"16px 0"}}/>
        <div style={{fontSize:11,fontWeight:600,color:T.dim,textTransform:"uppercase",letterSpacing:".08em",marginBottom:10}}>Backup &amp; Export</div>
        <div style={{display:"flex",gap:10}}>
          <button className="mbtn" style={{flex:1,justifyContent:"center"}} onClick={()=>doExport("json")}>
            {expDone?<><i className="ti ti-check" style={{color:T.green}}/> Downloaded!</>:<><i className="ti ti-file-export"/> Export JSON</>}
          </button>
          <button className="mbtn" style={{flex:1,justifyContent:"center"}} onClick={()=>doExport("csv")}>
            <i className="ti ti-table-export"/> Export CSV
          </button>
        </div>
        <div style={{fontSize:11,color:T.dim,marginTop:8}}>JSON = full backup. CSV = spreadsheet-compatible.</div>

        <div className="m-row"><button className="mbtn pri" onClick={onClose}>Done</button></div>
      </div>
    </div>
  );
});

const CmdPalette=memo(function CmdPalette({onClose,onAction,notes}){
  const[q,setQ]=useState("");const[hi,setHi]=useState(0);const ref=useRef(null);
  useEffect(()=>ref.current?.focus(),[]);
  const cmds=[
    {id:"new",label:"New Note",icon:"ti-file-plus",kbd:"⌘N",act:"new_note"},
    {id:"import",label:"Import CSV",icon:"ti-file-import",kbd:"",act:"import"},
    {id:"folder",label:"New Folder",icon:"ti-folder-plus",kbd:"",act:"new_folder"},
    {id:"draw",label:"Toggle Draw Mode",icon:"ti-pencil",kbd:"⌘D",act:"toggle_draw"},
    {id:"sync",label:"Sync & Backup",icon:"ti-cloud",kbd:"",act:"sync"},
    {id:"link",label:"Link Article",icon:"ti-link",kbd:"",act:"link"},
  ];
  const fC=useMemo(()=>q.trim()?cmds.filter(c=>c.label.toLowerCase().includes(q.toLowerCase())):cmds,[q]);
  const fN=useMemo(()=>q.trim()?notes.filter(n=>n.title.toLowerCase().includes(q.toLowerCase())||n.content.replace(/<[^>]+>/g,"").toLowerCase().includes(q.toLowerCase())).slice(0,5):[],[q,notes]);
  const total=fC.length+fN.length;
  useEffect(()=>setHi(0),[q]);
  function onKey(e){
    if(e.key==="ArrowDown"){e.preventDefault();setHi(h=>(h+1)%total);}
    if(e.key==="ArrowUp"){e.preventDefault();setHi(h=>(h-1+total)%total);}
    if(e.key==="Enter"){if(hi<fC.length){onAction(fC[hi].act);onClose();}else{onAction("open_note",fN[hi-fC.length].id);onClose();}}
    if(e.key==="Escape")onClose();
  }
  return(
    <div className="cmd-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="cmd-box">
        <input ref={ref} className="cmd-input" placeholder="Search notes or type a command…" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={onKey}/>
        <div className="cmd-results">
          {fC.length>0&&<div className="cmd-sec">Commands</div>}
          {fC.map((c,i)=><div key={c.id} className={`cmd-item ${hi===i?"hi":""}`} onClick={()=>{onAction(c.act);onClose();}} onMouseEnter={()=>setHi(i)}><i className={`ti ${c.icon} cmd-item-icon`}/>{c.label}{c.kbd&&<span className="cmd-kbd">{c.kbd}</span>}</div>)}
          {fN.length>0&&<div className="cmd-sec">Notes</div>}
          {fN.map((n,i)=><div key={n.id} className={`cmd-item ${hi===fC.length+i?"hi":""}`} onClick={()=>{onAction("open_note",n.id);onClose();}} onMouseEnter={()=>setHi(fC.length+i)}><i className="ti ti-notes cmd-item-icon"/>{n.title}</div>)}
          {total===0&&<div style={{padding:"14px 18px",color:T.muted,fontSize:13}}>No results for "{q}"</div>}
        </div>
      </div>
    </div>
  );
});

const NoteCard=memo(function NoteCard({note,active,onClick}){

/* ─── MAIN APP ───────────────────────────────────────────────────────────── */
function App(){
  const[state,dispatch]=useReducer(reducer,SEED);
  const[loaded,setLoaded]=useState(false);
  const[selFolder,setSF]=useState(null);const[selNote,setSN]=useState("n1");
  const[search,setSrc]=useState("");const[drawing,setDr]=useState(false);
  const[dColor,setDC]=useState(T.green);const[dSize,setDS]=useState(3);
  const[sbCol,setSbc]=useState(false);const[rpOpen,setRP]=useState(true);
  const[modal,setM]=useState(null);const[toast,setTt]=useState(null);
  const[lightbox,setLb]=useState(null);const[cmd,setCmd]=useState(false);
  const[mobV,setMob]=useState("list");const[tagIn,setTI]=useState("");

  /* Sync state */
  const[syncState,setSyncState]=useState("signed-out"); // signed-out | syncing | synced | error | offline
  const[userEmail,setUserEmail]=useState("");
  const[driveFileId,setDriveFileId]=useState(null);
  const syncStateRef=useRef("signed-out");
  const driveFileIdRef=useRef(null);

  const fileRef=useRef(null);const camRef=useRef(null);const toastRef=useRef(null);const richRef=useRef(null);
  const note=selNote?state.notes.find(n=>n.id===selNote):null;

  /* Load from IndexedDB first (offline cache) */
  useEffect(()=>{
    idbGet("nb_state_v5").then(s=>{if(s)dispatch({type:"INIT",payload:s});setLoaded(true);}).catch(()=>setLoaded(true));
  },[]);

  /* Save to IndexedDB on every change (offline cache + debounced Drive sync) */
  const localSave=useCallback(debounce((s)=>idbSet("nb_state_v5",s).catch(()=>{}),500),[]);
  useEffect(()=>{if(loaded)localSave(state);},[state,loaded]);

  /* Drive sync — push on every change (debounced 3s) */
  const drivePush=useCallback(debounce(async(s)=>{
    if(!tokenValid()||syncStateRef.current==="offline")return;
    try{
      setSyncState("syncing");syncStateRef.current="syncing";
      const res=await writeDriveFile(driveFileIdRef.current,s,_gToken);
      if(!driveFileIdRef.current&&res?.id){driveFileIdRef.current=res.id;setDriveFileId(res.id);}
      setSyncState("synced");syncStateRef.current="synced";
    }catch(e){setSyncState("error");syncStateRef.current="error";console.warn("Drive push failed",e);}
  },3000),[]);
  useEffect(()=>{if(loaded&&syncStateRef.current==="synced")drivePush(state);},[state,loaded]);

  /* Drive pull — on sign-in and every 30s */
  async function drivePull(token){
    try{
      let fid=driveFileIdRef.current||await findDriveFile(token);
      if(fid){
        driveFileIdRef.current=fid;setDriveFileId(fid);
        const remote=await readDriveFile(fid,token);
        if(remote?.notes){
          // Merge: take whichever is newer per note, then union
          const local=await idbGet("nb_state_v5")||state;
          const byId=new Map();
          [...(local.notes||[]),...(remote.notes||[])].forEach(n=>{
            const ex=byId.get(n.id);
            if(!ex||new Date(n.updatedAt)>new Date(ex.updatedAt))byId.set(n.id,n);
          });
          const merged={...remote,notes:Array.from(byId.values()),folders:remote.folders||local.folders||SEED.folders};
          dispatch({type:"INIT",payload:merged});
          await idbSet("nb_state_v5",merged);
        }
      }
      setSyncState("synced");syncStateRef.current="synced";
    }catch(e){setSyncState("error");syncStateRef.current="error";console.warn("Drive pull failed",e);}
  }

  /* Sign in */
  async function signIn(){
    const clientId=window.GOOGLE_CLIENT_ID;
    if(!clientId||clientId.startsWith("YOUR_")){toast_("Paste your Google Client ID into the HTML file first","ti-alert-circle");return;}
    try{
      setSyncState("syncing");syncStateRef.current="syncing";
      const token=await requestGoogleToken(clientId);
      // Get user info
      try{const info=await(await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:`Bearer ${token}`}})).json();setUserEmail(info.email||"");}catch{}
      await drivePull(token);
      toast_("Signed in and synced","ti-cloud-check");
    }catch(e){setSyncState("signed-out");syncStateRef.current="signed-out";toast_("Sign-in cancelled or failed","ti-alert-circle");}
  }

  function signOut(){_gToken=null;_tokenExpiry=0;setSyncState("signed-out");syncStateRef.current="signed-out";setUserEmail("");toast_("Signed out","ti-logout");}

  /* Periodic pull every 30s when signed in */
  useEffect(()=>{
    const interval=setInterval(()=>{if(tokenValid())drivePull(_gToken);},30000);
    return()=>clearInterval(interval);
  },[]);

  /* Offline detection */
  useEffect(()=>{
    const goOffline=()=>{if(syncState!=="signed-out"){setSyncState("offline");syncStateRef.current="offline";}};
    const goOnline=()=>{if(syncStateRef.current==="offline"&&tokenValid()){setSyncState("syncing");drivePull(_gToken);}};
    window.addEventListener("offline",goOffline);window.addEventListener("online",goOnline);
    return()=>{window.removeEventListener("offline",goOffline);window.removeEventListener("online",goOnline);};
  },[syncState]);

  function toast_(msg,icon="ti-check"){clearTimeout(toastRef.current);setTt({msg,icon});toastRef.current=setTimeout(()=>setTt(null),2800);}

  useEffect(()=>{
    const h=(e)=>{
      const m=e.metaKey||e.ctrlKey;
      if(m&&e.key==="k"){e.preventDefault();setCmd(p=>!p);}
      if(m&&e.key==="n"){e.preventDefault();newNote();}
      if(m&&e.key==="d"){e.preventDefault();setDr(d=>!d);}
      if(e.key==="Escape"){setCmd(false);setM(null);setDr(false);}
    };
    window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);
  },[]);

  const updateNote=useCallback((id,updates)=>dispatch({type:"UPDATE_NOTE",id,updates}),[]);
  function newNote(){const n={id:uid(),folderId:selFolder,title:"Untitled Note",content:"",tags:[],images:[],links:[],layers:[{id:uid(),name:"Annotations",strokes:[],visible:true}],activeLayer:0,pinned:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};dispatch({type:"ADD_NOTE",note:n});setSN(n.id);setMob("editor");}
  function delNote(id){dispatch({type:"DELETE_NOTE",id});if(selNote===id){setSN(null);setMob("list");}toast_("Note deleted","ti-trash");}
  function addStroke(s){if(!note)return;const layers=note.layers.map((l,i)=>i===(note.activeLayer??0)?{...l,strokes:[...l.strokes,s]}:l);updateNote(note.id,{layers});}
  function addLayer(){if(!note)return;const layers=[...note.layers,{id:uid(),name:`Layer ${note.layers.length+1}`,strokes:[],visible:true}];updateNote(note.id,{layers,activeLayer:layers.length-1});toast_("Layer added");}
  function clearLayer(){if(!note)return;const layers=note.layers.map((l,i)=>i===(note.activeLayer??0)?{...l,strokes:[]}:l);updateNote(note.id,{layers});toast_("Layer cleared","ti-eraser");}
  function toggleVis(idx){if(!note)return;const layers=note.layers.map((l,i)=>i===idx?{...l,visible:!l.visible}:l);updateNote(note.id,{layers});}
  function handleImages(e){const files=Array.from(e.target.files);files.forEach(f=>{const r=new FileReader();r.onload=ev=>updateNote(note.id,{images:[...(note.images||[]),{id:uid(),src:ev.target.result,name:f.name}]});r.readAsDataURL(f);});toast_(`${files.length} image${files.length>1?"s":""} added`,"ti-photo");}
  function rmImage(id){updateNote(note.id,{images:note.images.filter(i=>i.id!==id)});}
  function addLink(l){updateNote(note.id,{links:[...(note.links||[]),l]});toast_("Link added","ti-link");}
  function rmLink(id){updateNote(note.id,{links:note.links.filter(l=>l.id!==id)});}
  function addTag(t){t=t.trim().toLowerCase();if(!t||note.tags.includes(t))return;updateNote(note.id,{tags:[...note.tags,t]});}
  function importNotes(notes){dispatch({type:"IMPORT_NOTES",notes});toast_(`${notes.length} notes imported`,"ti-file-check");}

  function exportNotes(format="json"){
    const plain=state.notes.map(n=>({...n,content:n.content.replace(/<[^>]+>/g,""),images:n.images.map(i=>({id:i.id,name:i.name})),layers:n.layers.map(l=>({...l,strokes:l.strokes.length+" strokes"}))}));
    let blob,filename;
    if(format==="csv"){
      const hdr="title,content,tags,folder,createdAt";
      const rows=plain.map(n=>[`"${(n.title||"").replace(/"/g,'""')}"`,`"${(n.content||"").replace(/"/g,'""').replace(/\n/g," ")}"`,`"${(n.tags||[]).join(";")}"`,`"${state.folders.find(f=>f.id===n.folderId)?.name||""}"`,n.createdAt].join(","));
      blob=new Blob([[hdr,...rows].join("\n")],{type:"text/csv"});filename=`nexusbase-${new Date().toISOString().slice(0,10)}.csv`;
    }else{
      blob=new Blob([JSON.stringify({exported:new Date().toISOString(),notes:plain,folders:state.folders},null,2)],{type:"application/json"});filename=`nexusbase-${new Date().toISOString().slice(0,10)}.json`;
    }
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);
    toast_(`Exported as ${format.toUpperCase()}`,"ti-file-check");
  }

  function cmdAction(act,payload){
    if(act==="new_note")newNote();if(act==="import")setM("import");if(act==="new_folder")setM("folder");
    if(act==="toggle_draw")setDr(d=>!d);if(act==="sync")setM("sync");if(act==="link")setM("link");
    if(act==="open_note"){setSN(payload);setMob("editor");}
  }
  function execFmt(cmd,val){richRef.current?.focus();document.execCommand(cmd,false,val);}

  const filtered=useMemo(()=>state.notes.filter(n=>{const inF=selFolder?n.folderId===selFolder:true;const q=search.toLowerCase();return inF&&(!q||n.title.toLowerCase().includes(q)||n.content.replace(/<[^>]+>/g,"").toLowerCase().includes(q)||(n.tags||[]).some(t=>t.includes(q)));}).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)),[state.notes,selFolder,search]);
  const fCount=useCallback(fid=>state.notes.filter(n=>n.folderId===fid).length,[state.notes]);
  const SWATCHES=[T.green,"#ffffff",T.red,T.amber,T.blue,"#cc55e0","#ff8c42"];
  const isConfigured=window.GOOGLE_CLIENT_ID&&!window.GOOGLE_CLIENT_ID.startsWith("YOUR_");

  /* Sync status strip data */
  const syncInfo={
    "signed-out":{pip:"grey",label:isConfigured?"Sign in to sync":"Setup required",cls:"signed-out",icon:"ti-brand-google"},
    "syncing"   :{pip:"pulse green",label:"Syncing…",cls:"syncing",icon:"ti-refresh"},
    "synced"    :{pip:"green",label:`Synced · ${userEmail||"Google"}`,cls:"synced",icon:"ti-cloud-check"},
    "error"     :{pip:"red",label:"Sync error — tap to retry",cls:"error",icon:"ti-cloud-x"},
    "offline"   :{pip:"grey",label:"Offline — saved locally",cls:"offline",icon:"ti-wifi-off"},
  }[syncState]||{pip:"grey",label:"Unknown",cls:"offline",icon:"ti-cloud"};

  if(!loaded)return(<div style={{background:T.bg0,color:T.white,height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Inter,sans-serif",gap:10}}><i className="ti ti-loader" style={{fontSize:24,color:T.green,animation:"spin 1s linear infinite"}}/> Loading…</div>);

  return(
    <>
      <style>{CSS}</style>
      <div className="root">

        {/* SIDEBAR */}
        <nav className={`sb ${sbCol?"col":""}`}>
          <div className="sb-head">
            <div className="sb-logo-dot"><i className="ti ti-database"/></div>
            {!sbCol&&<span className="sb-logo-name">Nexus<span>Base</span></span>}
          </div>

          {!sbCol&&<div className="sb-search-wrap"><i className="ti ti-search sb-search-icon"/><input className="sb-search" placeholder="Search notes…" value={search} onChange={e=>setSrc(e.target.value)}/></div>}

          {!sbCol&&<div className="sb-body">
            <div className="sb-sec">Folders<IconBtn icon="ti-plus" onClick={()=>setM("folder")} title="New folder"/></div>
            {[{id:null,name:"All Notes",icon:"ti-home",count:state.notes.length},...state.folders.map(f=>({...f,count:fCount(f.id)}))].map(f=>(
              <div key={f.id||"all"} className={`sb-row ${selFolder===f.id?"active":""}`} onClick={()=>setSF(f.id)} tabIndex={0}>
                <i className={`ti ${f.icon} sb-row-icon`}/><span className="sb-row-name">{f.name}</span><span className="sb-row-badge">{f.count}</span>
              </div>
            ))}
          </div>}

          <div className="sb-foot">
            {!sbCol&&<>
              {/* Sync strip — tappable */}
              <div className={`sync-strip ${syncInfo.cls}`} onClick={syncState==="signed-out"&&isConfigured?signIn:()=>setM("sync")}>
                <i className={`ti ${syncInfo.icon}`} style={{fontSize:15,flexShrink:0,color:syncState==="synced"?T.green:syncState==="error"?T.red:T.muted}}/>
                <span style={{flex:1,fontSize:11,color:syncState==="synced"?T.green:syncState==="error"?T.red:T.white,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{syncInfo.label}</span>
                {syncState==="signed-out"&&isConfigured&&<i className="ti ti-arrow-right" style={{fontSize:12,color:T.green,flexShrink:0}}/>}
              </div>
              {!isConfigured&&<div className="setup-banner" onClick={()=>setM("sync")}><strong><i className="ti ti-alert-triangle" style={{marginRight:5}}/>Sync setup required</strong>Tap here to see the setup guide for Google Drive sync.</div>}
              <button className="sb-util-btn" onClick={()=>setCmd(true)}><i className="ti ti-terminal sb-util-icon"/>Command Palette<span style={{marginLeft:"auto",fontSize:10,color:T.dim}}>⌘K</span></button>
              <button className="sb-util-btn" onClick={()=>setM("import")}><i className="ti ti-file-import sb-util-icon"/>Import CSV</button>
              <button className="sb-util-btn" onClick={()=>exportNotes("json")}><i className="ti ti-file-export sb-util-icon"/>Export Backup</button>
            </>}
            <button className="sb-util-btn" onClick={()=>setSbc(c=>!c)} title={sbCol?"Expand":"Collapse"}>
              <i className={`ti ${sbCol?"ti-layout-sidebar-right":"ti-layout-sidebar-left"} sb-util-icon`}/>{!sbCol&&"Collapse"}
            </button>
          </div>
        </nav>

        {/* NOTE LIST */}
        <div className={`nl ${mobV==="list"?"mob":""}`}>
          <div className="nl-head">
            <span className="nl-title">{selFolder?(state.folders.find(f=>f.id===selFolder)?.name||"Notes"):"All Notes"}<span className="nl-count">({filtered.length})</span></span>
            <button className="btn-new-note" onClick={newNote}><i className="ti ti-plus"/> New Note</button>
          </div>
          <div className="nl-scroll">
            {filtered.length===0&&<div style={{padding:"28px 16px",textAlign:"center",color:T.muted,fontSize:13}}><i className="ti ti-notes-off" style={{fontSize:28,display:"block",marginBottom:8}}/>No notes here yet</div>}
            {filtered.map(n=><NoteCard key={n.id} note={n} active={selNote===n.id} onClick={()=>{setSN(n.id);setMob("editor");}}/>)}
          </div>
        </div>

        {/* EDITOR */}
        <main className={`editor ${mobV==="editor"?"mob":""}`}>
          {!note?(
            <div className="empty">
              <i className="ti ti-notebook"/>
              <div className="empty-title">No note selected</div>
              <div className="empty-sub">Select a note or create a new one</div>
              <button className="btn-new-note" style={{marginTop:8}} onClick={newNote}><i className="ti ti-plus"/> New Note</button>
              <div className="empty-hint">Ctrl/⌘K — command palette</div>
            </div>
          ):(
            <>
              <div className="ed-tb1">
                <button className="btn-solid mob-back" onClick={()=>setMob("list")}><i className="ti ti-arrow-left"/> Back</button>
                <div className="btn-group">
                  <button className={`btn-group-item ${note.pinned?"on":""}`} onClick={()=>updateNote(note.id,{pinned:!note.pinned})}><i className={`ti ${note.pinned?"ti-pin-filled":"ti-pin"}`}/>{note.pinned?"Pinned":"Pin"}</button>
                </div>
                <div className="btn-group">
                  <button className="btn-group-item" onClick={()=>fileRef.current.click()}><i className="ti ti-photo"/> Add Image</button>
                  <button className="btn-group-item" onClick={()=>camRef.current.click()}><i className="ti ti-camera"/> Camera</button>
                  <button className="btn-group-item" onClick={()=>setM("link")}><i className="ti ti-link"/> Link Article</button>
                </div>
                <div className="btn-group">
                  <button className={`btn-group-item ${drawing?"on":""}`} onClick={()=>setDr(d=>!d)}><i className="ti ti-pencil"/>{drawing?"Exit Draw":"Draw"}</button>
                  {drawing&&<><button className="btn-group-item" onClick={addLayer}><i className="ti ti-layers-intersect"/> New Layer</button><button className="btn-group-item" onClick={clearLayer}><i className="ti ti-eraser"/> Clear Layer</button></>}
                </div>
                <div className="tb-spacer"/>
                <button className={`btn-solid ${rpOpen?"on":""}`} onClick={()=>setRP(o=>!o)}><i className="ti ti-layout-sidebar-right"/>{rpOpen?"Hide Panel":"Show Panel"}</button>
                <button className="btn-solid danger" onClick={()=>delNote(note.id)}><i className="ti ti-trash"/> Delete</button>
              </div>

              <div className="ed-tb2">
                <span className="fmt-label">Format</span><div className="tb-sep"/>
                <button className="fmt-btn-text" onMouseDown={e=>{e.preventDefault();execFmt("bold");}}><strong>B</strong></button>
                <button className="fmt-btn-text" onMouseDown={e=>{e.preventDefault();execFmt("italic");}} style={{fontStyle:"italic"}}>I</button>
                <button className="fmt-btn-text" onMouseDown={e=>{e.preventDefault();execFmt("underline");}} style={{textDecoration:"underline"}}>U</button>
                <div className="tb-sep"/>
                <button className="fmt-btn" onMouseDown={e=>{e.preventDefault();execFmt("formatBlock","h2");}} title="Heading 2"><i className="ti ti-heading"/></button>
                <button className="fmt-btn" onMouseDown={e=>{e.preventDefault();execFmt("formatBlock","h3");}} title="Heading 3"><i className="ti ti-h-3"/></button>
                <button className="fmt-btn" onMouseDown={e=>{e.preventDefault();execFmt("formatBlock","blockquote");}} title="Quote"><i className="ti ti-quote"/></button>
                <div className="tb-sep"/>
                <button className="fmt-btn" onMouseDown={e=>{e.preventDefault();execFmt("insertUnorderedList");}} title="Bullet list"><i className="ti ti-list"/></button>
                <button className="fmt-btn" onMouseDown={e=>{e.preventDefault();execFmt("insertOrderedList");}} title="Numbered list"><i className="ti ti-list-numbers"/></button>
                <div className="tb-sep"/>
                <select style={{background:T.bg3,border:`1px solid ${T.border2}`,borderRadius:6,padding:"4px 8px",color:T.white,fontSize:12,cursor:"pointer",outline:"none"}} onChange={e=>{execFmt("fontName",e.target.value);e.target.value="";}}>
                  <option value="">Font…</option><option value="Inter">Sans</option><option value="ui-monospace">Mono</option><option value="Georgia">Serif</option>
                </select>
              </div>

              {drawing&&<div className="ed-draw-bar">
                <span className="draw-label">Colour:</span>
                {SWATCHES.map(c=><div key={c} className={`clr-swatch ${dColor===c?"sel":""}`} style={{background:c}} onClick={()=>setDC(c)}/>)}
                <div style={{width:1,height:16,background:T.border2,margin:"0 4px"}}/>
                <span className="draw-label">Size: {dSize}px</span>
                <input type="range" min={1} max={24} step={1} value={dSize} onChange={e=>setDS(+e.target.value)} style={{width:80}}/>
                <span className="draw-layer-badge"><i className="ti ti-layers-subtract"/> {note.layers[note.activeLayer??0]?.name}</span>
              </div>}

              <div className="ed-body">
                <div className="ed-main">
                  <DrawCanvas layers={note.layers} isActive={drawing} color={dColor} size={dSize} onStrokeDone={addStroke}/>
                  <input className="ed-title" value={note.title} onChange={e=>updateNote(note.id,{title:e.target.value})} placeholder="Note title…"/>
                  <div className="ed-tags">
                    {(note.tags||[]).map(t=><span key={t} className="tag">{t}<span className="tag-x" onClick={()=>updateNote(note.id,{tags:note.tags.filter(x=>x!==t)})}>×</span></span>)}
                    <input className="tag-input-pill" placeholder="+ add tag" value={tagIn} onChange={e=>setTI(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"||e.key===","){addTag(tagIn.replace(/,$/,""));setTI("");e.preventDefault();}}}/>
                  </div>
                  <div className="ed-scroll">
                    <div ref={richRef} className="rich" contentEditable suppressContentEditableWarning data-ph="Start writing…" dangerouslySetInnerHTML={{__html:note.content}} onInput={e=>updateNote(note.id,{content:e.currentTarget.innerHTML})}/>
                    {note.images?.length>0&&<>
                      <div className="sec-h"><i className="ti ti-photo"/> Images ({note.images.length})</div>
                      <div className="img-grid">{note.images.map(img=><div key={img.id} className="img-thumb" onClick={()=>setLb(img.src)}><img src={img.src} alt={img.name} loading="lazy"/><button className="img-rm" onClick={e=>{e.stopPropagation();rmImage(img.id);}}><i className="ti ti-x"/></button></div>)}</div>
                    </>}
                    {note.links?.length>0&&<>
                      <div className="sec-h"><i className="ti ti-link"/> Linked Articles ({note.links.length})</div>
                      {note.links.map(l=><div key={l.id} className="link-card"><i className="ti ti-world" style={{color:T.green,fontSize:16,flexShrink:0}}/><div className="link-card-info"><div className="link-card-title">{l.title}</div><div className="link-card-url">{l.url}</div></div><i className="ti ti-external-link link-card-action" onClick={()=>window.open(l.url,"_blank")}/><i className="ti ti-x link-card-action" onClick={()=>rmLink(l.id)} style={{marginLeft:4}}/></div>)}
                    </>}
                  </div>
                </div>

                {rpOpen&&<aside className="rp">
                  <div className="rp-sec">
                    <div className="rp-label">Layers<IconBtn icon="ti-plus" onClick={addLayer} title="Add layer"/></div>
                    {note.layers.map((l,idx)=>(
                      <div key={l.id} className={`layer-row ${(note.activeLayer??0)===idx?"active":""}`} onClick={()=>updateNote(note.id,{activeLayer:idx})}>
                        <i className="ti ti-layers-subtract" style={{fontSize:13,color:T.green}}/><span className="layer-name">{l.name}</span><span className="layer-count">{l.strokes.length}</span>
                        <i className={`ti ${l.visible?"ti-eye":"ti-eye-off"} layer-vis`} onClick={e=>{e.stopPropagation();toggleVis(idx);}}/>
                      </div>
                    ))}
                  </div>
                  {note.links?.length>0&&<div className="rp-sec">
                    <div className="rp-label">Quick Links</div>
                    {note.links.map(l=><div key={l.id} className="ql-item" onClick={()=>window.open(l.url,"_blank")}><i className="ti ti-world" style={{color:T.green,fontSize:13}}/>{l.title.length>22?l.title.slice(0,22)+"…":l.title}</div>)}
                  </div>}
                  <div className="rp-sec">
                    <div className="rp-label">Folder</div>
                    <select className="rp-select" value={note.folderId||""} onChange={e=>updateNote(note.id,{folderId:e.target.value||null})}>
                      <option value="">No folder</option>{state.folders.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
                    </select>
                  </div>
                  <div className="rp-sec">
                    <div className="rp-label">Note Info</div>
                    <div className="rp-info">
                      <div>Created<span>{fmtDate(note.createdAt)}</span></div>
                      <div>Updated<span>{fmtDate(note.updatedAt)}</span></div>
                      <div>Images<span>{note.images?.length||0}</span></div>
                      <div>Links<span>{note.links?.length||0}</span></div>
                      <div>Layers<span>{note.layers?.length||0}</span></div>
                      <div>Sync<span style={{color:syncState==="synced"?T.green:T.muted}}>{syncState}</span></div>
                    </div>
                  </div>
                </aside>}
              </div>
            </>
          )}
        </main>
      </div>

      <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={handleImages}/>
      <input ref={camRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handleImages}/>

      {modal==="import"&&<ImportModal onClose={()=>setM(null)} onImport={importNotes}/>}
      {modal==="link"&&note&&<LinkModal onClose={()=>setM(null)} onAdd={addLink}/>}
      {modal==="sync"&&<SyncModal onClose={()=>setM(null)} syncState={syncState} onSignIn={signIn} onSignOut={signOut} noteCount={state.notes.length} onExport={exportNotes} userEmail={userEmail}/>}
      {modal==="folder"&&<FolderModal onClose={()=>setM(null)} onAdd={f=>dispatch({type:"ADD_FOLDER",folder:f})}/>}
      {cmd&&<CmdPalette onClose={()=>setCmd(false)} onAction={cmdAction} notes={state.notes}/>}
      {lightbox&&<div className="lightbox" onClick={()=>setLb(null)}><img src={lightbox} alt="Full size" onClick={e=>e.stopPropagation()}/></div>}
      {toast&&<div className="toast"><i className={`ti ${toast.icon}`} style={{color:T.green}}/>{toast.msg}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
